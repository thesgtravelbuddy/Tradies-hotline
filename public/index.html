<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradies Hotline - Voice Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 900px;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 16px 16px 0 0;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 16px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 15px;
    }

    .message.assistant .message-bubble {
      background: #f0f0f0;
      color: #333;
      position: relative;
    }

    .message.user .message-bubble {
      background: #667eea;
      color: white;
    }

    .message-bubble .speaker-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      margin-left: 8px;
      padding: 4px;
      vertical-align: middle;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #999;
      text-align: center;
      gap: 16px;
    }

    .empty-state-icon {
      font-size: 48px;
    }

    .input-section {
      border-top: 1px solid #eee;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-voice {
      background: #667eea;
      color: white;
      flex: 1;
      min-width: 140px;
    }

    .btn-voice:hover:not(:disabled) {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
    }

    .btn-voice:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .btn-voice.recording {
      background: #e74c3c;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .btn-upload {
      background: #48bb78;
      color: white;
      flex: 1;
      min-width: 120px;
    }

    .btn-upload:hover {
      background: #38a169;
    }

    .btn-send {
      background: #667eea;
      color: white;
      width: 100%;
    }

    .btn-send:hover:not(:disabled) {
      background: #5568d3;
    }

    .input-text {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 100px;
    }

    .input-text:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .status {
      font-size: 12px;
      color: #666;
      text-align: center;
    }

    .recording-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #e74c3c;
      font-weight: 600;
    }

    .file-input {
      display: none;
    }

    .form-section {
      display: none;
      padding: 16px;
      background: #f9f9f9;
      border-radius: 8px;
      gap: 12px;
      flex-direction: column;
    }

    .form-section.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }

    .form-group input, .form-group select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-group small {
      font-size: 12px;
      color: #999;
    }

    .error-message {
      padding: 12px;
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      color: #721c24;
      font-size: 13px;
      display: none;
    }

    .error-message.active {
      display: block;
    }

    .success-screen {
      display: none;
      text-align: center;
      gap: 16px;
      flex-direction: column;
    }

    .success-screen.active {
      display: flex;
    }

    .tradsman-card {
      background: white;
      border: 2px solid #667eea;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      gap: 12px;
      display: flex;
      flex-direction: column;
    }

    .tradsman-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto;
      border-radius: 8px;
      object-fit: contain;
      background: #f0f0f0;
    }

    .resources-list {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
      gap: 8px;
      flex-direction: column;
      display: flex;
    }

    .resource-item {
      padding: 8px;
      background: #f9f9f9;
      border-left: 3px solid #667eea;
      font-size: 12px;
      line-height: 1.4;
    }

    .resource-link {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .resource-link:hover {
      text-decoration: underline;
    }

    .tts-controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .tts-btn {
      background: none;
      border: 1px solid #667eea;
      color: #667eea;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tts-btn:hover {
      background: #667eea;
      color: white;
    }

    .tts-btn.playing {
      background: #667eea;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔧 Tradies Hotline</h1>
      <p>Voice-Powered Trade Request</p>
    </div>

    <div class="content">
      <!-- Chat area -->
      <div class="chat-container" id="chatContainer">
        <div class="empty-state">
          <div class="empty-state-icon">👂</div>
          <p>Click the microphone to describe your problem</p>
        </div>
      </div>

      <!-- Customer details form -->
      <div class="form-section" id="detailsForm">
        <div style="font-weight: 600; margin-bottom: 8px;">Before we send this to the tradsman:</div>
        <div class="form-group">
          <label>Phone Number (optional)</label>
          <input type="tel" id="phone" placeholder="+61412345678">
          <small>For the tradsman to contact you</small>
        </div>
        <div class="form-group">
          <label>Email Address (optional)</label>
          <input type="email" id="email" placeholder="you@example.com">
          <small>For confirmation and updates</small>
        </div>
        <div class="form-group">
          <label>Address (optional)</label>
          <input type="text" id="address" placeholder="123 Main Street, Sydney">
        </div>
        <div class="form-group">
          <label>Postcode (optional)</label>
          <input type="text" id="postcode" placeholder="2000">
        </div>
        <div class="form-group">
          <label>Preferred Timeslot (optional)</label>
          <input type="text" id="timeslot" placeholder="e.g., Tomorrow 9am-12pm">
        </div>
        <div class="error-message" id="contactError">Please provide either phone or email</div>
        <button class="btn-send" onclick="submitDetails()">Submit & Send to Tradsman</button>
      </div>

      <!-- Success screen -->
      <div class="success-screen" id="successScreen">
        <div style="font-size: 32px;">✅</div>
        <div style="font-size: 18px; font-weight: 600;">Request Submitted!</div>
        <div id="successMessage"></div>
        <div class="tradsman-card" id="tradsmanCard" style="display: none;">
          <img id="tradsmanLogo" class="tradsman-logo" src="" alt="Tradsman logo">
          <div style="font-weight: 600;" id="tradsmanName"></div>
          <div style="font-size: 13px; color: #666;" id="tradsmanType"></div>
        </div>
        <div class="resources-list" id="resourcesList" style="display: none;"></div>
      </div>
    </div>

    <!-- Input section -->
    <div class="input-section">
      <div class="status" id="statusText">Ready to listen...</div>
      <div class="button-group">
        <button class="btn-voice" id="recordBtn" onclick="toggleRecording()">
          <span id="recordIcon">🎤</span> <span id="recordLabel">Record</span>
        </button>
        <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
          📸 Photo/Video
        </button>
      </div>
      <textarea
        id="textInput"
        class="input-text"
        placeholder="Type here or use voice recording..."
        rows="2"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey) { event.preventDefault(); sendMessage(); }"
      ></textarea>
      <button class="btn-send" onclick="sendMessage()">Send Message</button>
    </div>
  </div>

  <input type="file" id="fileInput" class="file-input" accept="image/*,video/*" onchange="handleFileUpload(event)">

  <script>
    let messages = [];
    let submissionId = null;
    let conversationStarted = false;

    // =================================================================
    // Voice input (Web Speech API)
    // =================================================================
    let recognition = null;
    let isRecording = false;

    // Set synchronously the moment start()/stop() is requested. `isRecording`
    // only flips inside the async onstart/onend handlers, so it cannot guard a
    // second start() issued before onstart has fired - which is what produces
    // Chrome's InvalidStateError "recognition has already started".
    let recognitionPending = false;

    // If the browser never delivers onstart/onerror - the permission prompt is
    // dismissed rather than answered, or the tab is backgrounded mid-start -
    // `recognitionPending` would stay true forever and every later click would
    // be silently swallowed. The watchdog releases the guard so the button can
    // never end up permanently dead.
    let watchdogTimer = null;
    const VOICE_WATCHDOG_MS = 8000;

    // Whatever was already in the textarea when recording began. Transcripts are
    // appended to it instead of replacing it, so voice never eats typed text.
    let baseText = '';
    let finalTranscript = '';

    // Set by onerror so the onend that follows does not overwrite the
    // explanation with a generic "Ready to listen...".
    let pendingStatusMessage = '';

    function setStatus(message) {
      const el = document.getElementById('statusText');
      if (el) el.textContent = message;
    }

    function setVoiceUI(state) {
      const btn = document.getElementById('recordBtn');
      const label = document.getElementById('recordLabel');
      if (btn) btn.classList.toggle('recording', state === 'listening');
      if (label) label.textContent = state === 'listening' ? 'Stop' : 'Record';
    }

    function clearWatchdog() {
      if (watchdogTimer !== null) {
        clearTimeout(watchdogTimer);
        watchdogTimer = null;
      }
    }

    // The single recovery path: release every guard and return the button to idle.
    function resetVoiceUI(message) {
      clearWatchdog();
      isRecording = false;
      recognitionPending = false;
      setVoiceUI('idle');
      setStatus(message || 'Ready to listen...');
    }

    function armWatchdog() {
      clearWatchdog();
      watchdogTimer = setTimeout(() => {
        watchdogTimer = null;
        if (!recognitionPending) return;
        console.warn('Speech recognition did not respond in time - resetting.');
        try { if (recognition) recognition.abort(); } catch (_) { /* already dead */ }
        resetVoiceUI('Ready to listen... (tap Record to try again)');
      }, VOICE_WATCHDOG_MS);
    }

    function currentInputText() {
      const parts = [baseText.trim(), finalTranscript.trim()].filter(Boolean);
      return parts.join(' ');
    }

    function initSpeechRecognition() {
      const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

      // Chrome/Safari only expose the mic on a secure origin. Without this check
      // the constructor exists but start() fails silently - the classic
      // "the button does nothing" report when a build is served over plain http.
      if (window.isSecureContext === false) {
        const btn = document.getElementById('recordBtn');
        if (btn) btn.disabled = true;
        setStatus('Voice needs a secure (https) connection - please type instead');
        return;
      }

      if (!SpeechRecognitionCtor) {
        const btn = document.getElementById('recordBtn');
        if (btn) btn.disabled = true;
        setStatus('Voice input is not supported in this browser - please type instead');
        return;
      }

      try {
        recognition = new SpeechRecognitionCtor();
      } catch (error) {
        console.error('Could not create SpeechRecognition:', error);
        const btn = document.getElementById('recordBtn');
        if (btn) btn.disabled = true;
        setStatus('Voice input is unavailable - please type instead');
        return;
      }

      // continuous: the user decides when to stop, so a pause mid-sentence does
      // not silently end the session (important for older callers who speak slowly).
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      recognition.lang = 'en-AU';

      recognition.onstart = () => {
        clearWatchdog();
        isRecording = true;
        recognitionPending = false;
        pendingStatusMessage = '';
        setVoiceUI('listening');
        setStatus('🔴 Listening...');
      };

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript + ' ';
          } else {
            interim += transcript;
          }
        }
        const input = document.getElementById('textInput');
        if (!input) return;
        // Live preview: what is already typed + confirmed speech + the in-flight guess.
        const parts = [baseText.trim(), (finalTranscript + interim).trim()].filter(Boolean);
        input.value = parts.join(' ');
      };

      recognition.onerror = (event) => {
        const code = (event && event.error) || 'unknown';
        // "aborted" is what a normal stop() looks like - never surface it.
        if (code === 'aborted') {
          pendingStatusMessage = '';
        } else if (code === 'no-speech') {
          pendingStatusMessage = "Didn't catch that - tap Record and try again";
        } else if (code === 'not-allowed' || code === 'service-not-allowed') {
          pendingStatusMessage = '🎤 Microphone blocked - allow mic access in your browser settings';
        } else if (code === 'audio-capture') {
          pendingStatusMessage = '🎤 No microphone found - check your device';
        } else if (code === 'network') {
          pendingStatusMessage = '❌ Network problem - the speech service is unreachable';
        } else {
          pendingStatusMessage = '❌ Voice error: ' + code;
        }
        console.warn('Speech recognition error:', code);
        resetVoiceUI(pendingStatusMessage);
      };

      // onend is the one guaranteed terminal event - it fires after a stop(), an
      // abort(), an error, and an engine-initiated timeout. All cleanup and the
      // hand-off to the chat happen here so there is exactly one exit path.
      recognition.onend = () => {
        const captured = finalTranscript.trim();
        const input = document.getElementById('textInput');
        if (input) input.value = currentInputText();

        finalTranscript = '';
        baseText = '';

        resetVoiceUI(pendingStatusMessage || 'Ready to listen...');
        pendingStatusMessage = '';

        // Hand the recorded words to the chat.
        if (captured && input && input.value.trim()) {
          sendMessage();
        }
      };
    }

    function toggleRecording() {
      if (!recognition) {
        // Never leave a click unexplained.
        const btn = document.getElementById('recordBtn');
        if (btn) btn.disabled = true;
        setStatus('Voice input is not available - please type your message instead');
        return;
      }

      // A start or stop is already in flight - swallow this click rather than
      // calling start()/stop() twice and tripping InvalidStateError.
      if (recognitionPending) return;

      if (isRecording) {
        recognitionPending = true;
        armWatchdog();
        try {
          recognition.stop();
        } catch (error) {
          console.warn('Speech recognition stop() failed:', error);
          try { recognition.abort(); } catch (_) { /* nothing left to abort */ }
          resetVoiceUI('Ready to listen...');
        }
        return;
      }

      // Starting fresh: snapshot what is typed so speech is appended, not pasted over.
      const input = document.getElementById('textInput');
      baseText = input ? input.value : '';
      finalTranscript = '';
      pendingStatusMessage = '';

      recognitionPending = true;
      armWatchdog();
      try {
        recognition.start();
        setStatus('Starting microphone...');
      } catch (error) {
        // Chrome throws InvalidStateError when the engine is still winding down.
        // abort() forces it back to idle so the next click can succeed.
        console.warn('Speech recognition start() failed:', error);
        try { recognition.abort(); } catch (_) { /* already idle */ }
        resetVoiceUI('Ready to listen... (tap Record to try again)');
      }
    }

    initSpeechRecognition();

    async function startSubmission() {
      try {
        const response = await fetch('/api/v1/submission/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        const data = await response.json();
        submissionId = data.submissionId;
        conversationStarted = true;

        const greeting = "👋 Hello! Welcome to Tradies Hotline.\n\nI'm here to help you describe your plumbing issue so we can connect you with the right professional.\n\nTell me - what's happening with your plumbing? Feel free to share as much detail as you can.";
        // NOTE: the greeting is displayed only. It is deliberately NOT pushed into
        // `messages`, because Gemini (v1beta) rejects any history whose first turn
        // is a model/assistant turn: "First content should be with role 'user'".
        displayMessage('assistant', greeting);
      } catch (error) {
        console.error('Error starting submission:', error);
        document.getElementById('statusText').textContent = '❌ Connection error';
      }
    }

    // Build the history sent to /api/v1/chat.
    // Gemini v1beta requires the first turn to have role 'user', so we drop any
    // leading assistant turns and normalise each entry to {role, content}.
    function buildChatHistory() {
      const firstUser = messages.findIndex(m => m && m.role === 'user');
      if (firstUser === -1) return [];
      return messages
        .slice(firstUser)
        .filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string' && m.content.trim())
        .map(m => ({ role: m.role, content: m.content }));
    }

    async function sendMessage() {
      const textInput = document.getElementById('textInput');
      const userMessage = textInput.value.trim();

      if (!userMessage) return;

      if (!conversationStarted) {
        await startSubmission();
      }

      messages.push({ role: 'user', content: userMessage });
      displayMessage('user', userMessage);
      textInput.value = '';

      try {
        const response = await fetch('/api/v1/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: buildChatHistory(), submissionId })
        });

        if (!response.ok) {
          // The backend returns a plain { error, details } body on failure.
          let serverMessage = '';
          try {
            serverMessage = (await response.json()).error || '';
          } catch (_) { /* non-JSON error body */ }
          throw new Error(serverMessage || 'Chat failed');
        }

        const data = await response.json();
        messages.push({ role: 'assistant', content: data.content });
        displayMessage('assistant', data.content);

        // Auto-show form after 4-5 turns
        if (messages.length >= 8 && !document.getElementById('detailsForm').classList.contains('active')) {
          setTimeout(() => document.getElementById('detailsForm').classList.add('active'), 1000);
        }
      } catch (error) {
        console.error('Chat error:', error);
        displayMessage('assistant', '❌ Sorry, I had trouble processing that. Please try again.');
      }
    }

    function displayMessage(role, content) {
      const chatContainer = document.getElementById('chatContainer');

      // Remove empty state
      const emptyState = chatContainer.querySelector('.empty-state');
      if (emptyState && messages.length <= 2) {
        emptyState.remove();
      }

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = content;

      // Add TTS button for assistant messages
      if (role === 'assistant') {
        const speakerBtn = document.createElement('button');
        speakerBtn.className = 'tts-btn';
        speakerBtn.textContent = '🔊';
        speakerBtn.onclick = () => playText(content, speakerBtn);
        bubble.appendChild(speakerBtn);
      }

      messageDiv.appendChild(bubble);
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    /* ==================================================================
       TEXT-TO-SPEECH
       Goal: a natural-sounding, medium-pitched male voice that reads
       assertively, lifts on questions, and pauses like a human would.
       ================================================================== */

    // --- Voice selection ----------------------------------------------
    const TTS_MALE_HINTS = [
      'male', 'man', 'alex', 'aaron', 'arthur', 'brian', 'bruce', 'christopher',
      'daniel', 'david', 'eric', 'fred', 'george', 'gordon', 'guy', 'james',
      'jamie', 'john', 'lee', 'liam', 'mark', 'matthew', 'michael', 'nathan',
      'oliver', 'ralph', 'reed', 'rishi', 'roger', 'russell', 'ryan', 'steffan',
      'thomas', 'tom', 'william'
    ];

    const TTS_FEMALE_HINTS = [
      'female', 'woman', 'allison', 'amelie', 'ana', 'anna', 'aria', 'ava',
      'carol', 'catherine', 'clara', 'emma', 'fiona', 'hazel', 'jenny',
      'joanna', 'karen', 'kate', 'kathy', 'libby', 'linda', 'lisa', 'maisie',
      'michelle', 'moira', 'natasha', 'nicky', 'samantha', 'sandy', 'sara',
      'serena', 'shelley', 'sonia', 'susan', 'tessa', 'veena', 'victoria',
      'zira', 'zoe'
    ];

    // Novelty / low-quality engines that sound obviously synthetic.
    const TTS_ROBOTIC_HINTS = [
      'espeak', 'zarvox', 'trinoids', 'albert', 'bahh', 'bells', 'boing',
      'bubbles', 'cellos', 'deranged', 'hysterical', 'organ', 'whisper',
      'bad news', 'good news', 'pipe organ', 'compact', 'novelty'
    ];

    // Markers vendors use for their newer, more human-sounding models.
    const TTS_QUALITY_HINTS = [
      'natural', 'neural', 'premium', 'enhanced', 'siri', 'wavenet', 'studio'
    ];

    let ttsVoice = null;          // cached winner
    let ttsVoiceChosen = false;   // has selection run against a populated list

    function scoreVoice(voice) {
      const name = (voice.name || '').toLowerCase();
      const uri = (voice.voiceURI || '').toLowerCase();
      const id = name + ' ' + uri;
      const lang = (voice.lang || '').toLowerCase().replace('_', '-');
      let score = 0;

      // English only — anything else is disqualified outright.
      if (!lang.startsWith('en')) return -Infinity;

      // Locale: this is an Australian trades service, so match the accent
      // used by speech recognition (en-AU), then the nearest neighbours.
      if (lang.startsWith('en-au')) score += 45;
      else if (lang.startsWith('en-nz')) score += 28;
      else if (lang.startsWith('en-gb')) score += 25;
      else if (lang.startsWith('en-us')) score += 15;
      else score += 5;

      // Gender: female names are hard-excluded, male names strongly favoured.
      // "female" is checked first because it contains the substring "male".
      const isFemale = TTS_FEMALE_HINTS.some(h => id.includes(h));
      if (isFemale) return -Infinity;
      if (TTS_MALE_HINTS.some(h => id.includes(h))) score += 60;

      // Quality: reward modern neural voices, punish novelty/robotic ones.
      if (TTS_QUALITY_HINTS.some(h => id.includes(h))) score += 40;
      if (TTS_ROBOTIC_HINTS.some(h => id.includes(h))) score -= 80;

      // Legacy desktop SAPI voices (e.g. "Microsoft David Desktop") are the
      // classic robotic sound; the newer "Microsoft ... Online (Natural)"
      // voices already picked up the quality bonus above.
      if (id.includes('desktop')) score -= 35;
      if (id.includes('microsoft') && !id.includes('natural')) score -= 15;
      if (id.includes('google') && !id.includes('natural')) score -= 10;

      // Small tie-breakers.
      if (voice.localService) score += 3;   // no network stall mid-sentence
      if (voice.default) score += 2;

      return score;
    }

    function selectVoice() {
      let voices = [];
      try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
      if (!voices.length) return null;   // list not populated yet

      let best = null;
      let bestScore = -Infinity;
      voices.forEach(v => {
        const s = scoreVoice(v);
        if (s > bestScore) { bestScore = s; best = v; }
      });

      // Fallback chain: no acceptable male/English voice scored, so take any
      // English voice, and failing that the browser default (first entry).
      if (!best || bestScore === -Infinity) {
        best = voices.find(v => (v.lang || '').toLowerCase().startsWith('en-au'))
            || voices.find(v => (v.lang || '').toLowerCase().startsWith('en'))
            || voices.find(v => v.default)
            || voices[0];
      }

      ttsVoice = best || null;
      ttsVoiceChosen = !!best;
      return ttsVoice;
    }

    if ('speechSynthesis' in window) {
      // Voice lists load asynchronously in Chrome/Edge — prime it now and
      // re-run selection when the browser reports the list is ready.
      selectVoice();
      window.speechSynthesis.onvoiceschanged = () => selectVoice();
      window.addEventListener('beforeunload', () => window.speechSynthesis.cancel());
    }

    // --- Speech shaping ------------------------------------------------
    const TTS_BASE = { rate: 0.95, pitch: 0.85, volume: 1.0 };

    // Strip emoji/pictographs so the engine doesn't announce "cross mark".
    function cleanForSpeech(text) {
      return String(text || '')
        .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}]/gu, ' ')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    // Break into sentence-sized chunks. Chunking gives us human pacing
    // (real gaps between sentences) and dodges the Chrome bug where a long
    // single utterance cuts out after ~15 seconds.
    function buildChunks(text) {
      // Match-based split (rather than a lookbehind) so the script still
      // parses on older Safari builds.
      const raw = (cleanForSpeech(text).match(/[^.!?]+[.!?]*/g) || [])
        .map(s => s.trim())
        .filter(Boolean);

      // Decimal amounts ("$1.50", "3.5 hours") look like sentence breaks to
      // the splitter above — stitch those fragments back together.
      const sentences = [];
      raw.forEach(s => {
        const prev = sentences[sentences.length - 1];
        if (prev && /\d\.$/.test(prev) && /^\d/.test(s)) {
          sentences[sentences.length - 1] = prev + s;
        } else {
          sentences.push(s);
        }
      });

      const chunks = [];
      sentences.forEach(sentence => {
        // A question mark only ever lands on the final clause, so decide
        // the intonation once per sentence and apply it to every clause.
        const isQuestion = /\?\s*$/.test(sentence);

        // Very long sentences get split on clause boundaries so the
        // delivery keeps breathing instead of running on.
        const parts = sentence.length > 180
          ? (sentence.match(/[^,;:]+[,;:]*/g) || [sentence]).map(p => p.trim()).filter(Boolean)
          : [sentence];

        parts.forEach((part, i) => {
          const isLastPart = i === parts.length - 1;
          chunks.push({
            text: part,
            isQuestion,
            // Enquiring lift: questions rise slightly and slow a touch so
            // they land as a genuine question rather than a flat statement.
            pitch: isQuestion ? TTS_BASE.pitch + 0.15 : TTS_BASE.pitch,
            rate:  isQuestion ? TTS_BASE.rate - 0.03 : TTS_BASE.rate,
            // Beat of silence before a question — the assertive "hang on,
            // here's what I need from you" pause. Only before the opening
            // clause, never mid-sentence.
            gapBefore: (isQuestion && i === 0) ? 320 : 0,
            gapAfter: isLastPart ? 220 : 90
          });
        });
      });

      return chunks.length ? chunks : [{
        text: cleanForSpeech(text), isQuestion: false,
        pitch: TTS_BASE.pitch, rate: TTS_BASE.rate, gapBefore: 0, gapAfter: 0
      }];
    }

    // --- Playback ------------------------------------------------------
    let ttsRunId = 0;          // invalidates any in-flight sequence
    let ttsActiveButton = null;
    let ttsKeepAlive = null;

    function stopSpeech() {
      ttsRunId++;
      if (ttsKeepAlive) { clearInterval(ttsKeepAlive); ttsKeepAlive = null; }
      try { window.speechSynthesis.cancel(); } catch (e) {}
      if (ttsActiveButton) ttsActiveButton.classList.remove('playing');
      ttsActiveButton = null;
    }

    function playText(text, button) {
      if (!('speechSynthesis' in window)) return;

      // Clicking the speaker of the message that's already talking stops it.
      const wasPlaying = button && button.classList.contains('playing');
      stopSpeech();
      if (wasPlaying) return;

      const spoken = cleanForSpeech(text);
      if (!spoken) return;

      // Late-loading voice lists: try once more at play time.
      if (!ttsVoiceChosen) selectVoice();

      const runId = ++ttsRunId;
      const chunks = buildChunks(spoken);
      let index = 0;

      if (button) { button.classList.add('playing'); ttsActiveButton = button; }

      // Chrome silently suspends synthesis on longer reads; a periodic
      // resume() keeps it running.
      ttsKeepAlive = setInterval(() => {
        if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
          try { window.speechSynthesis.resume(); } catch (e) {}
        }
      }, 5000);

      const finish = () => {
        if (runId !== ttsRunId) return;
        if (ttsKeepAlive) { clearInterval(ttsKeepAlive); ttsKeepAlive = null; }
        if (button) button.classList.remove('playing');
        if (ttsActiveButton === button) ttsActiveButton = null;
      };

      const speakNext = () => {
        if (runId !== ttsRunId) return;             // superseded or stopped
        if (index >= chunks.length) return finish();

        const chunk = chunks[index++];
        const utterance = new SpeechSynthesisUtterance(chunk.text);

        if (ttsVoice) {
          utterance.voice = ttsVoice;
          utterance.lang = ttsVoice.lang;           // some engines need both
        } else {
          utterance.lang = 'en-AU';                 // fallback: at least the accent
        }

        utterance.rate = chunk.rate;
        utterance.pitch = chunk.pitch;
        utterance.volume = TTS_BASE.volume;

        utterance.onend = () => {
          if (runId !== ttsRunId) return;
          setTimeout(speakNext, chunk.gapAfter);
        };
        utterance.onerror = () => {
          if (runId !== ttsRunId) return;
          // Don't abandon the whole message on one bad chunk.
          setTimeout(speakNext, 60);
        };

        const start = () => {
          if (runId !== ttsRunId) return;
          try { window.speechSynthesis.speak(utterance); }
          catch (e) { finish(); }
        };

        chunk.gapBefore ? setTimeout(start, chunk.gapBefore) : start();
      };

      speakNext();
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!conversationStarted) {
        await startSubmission();
      }

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          displayMessage('user', `📎 Uploading ${file.name}...`);

          const response = await fetch('/api/v1/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              file: e.target.result,
              type: file.type,
              submissionId,
              filename: file.name
            })
          });

          if (!response.ok) throw new Error('Upload failed');

          const data = await response.json();
          displayMessage('user', `📎 ${file.name} uploaded`);
          displayMessage('assistant', 'Great! I can see the photo/video. Can you tell me more about what it shows?');
        } catch (error) {
          console.error('Upload error:', error);
          displayMessage('assistant', '❌ Failed to upload. Please try again.');
        }
      };

      reader.readAsDataURL(file);
      event.target.value = '';
    }

    async function submitDetails() {
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const address = document.getElementById('address').value.trim();
      const postcode = document.getElementById('postcode').value.trim();
      const timeslot = document.getElementById('timeslot').value.trim();

      if (!phone && !email) {
        document.getElementById('contactError').classList.add('active');
        return;
      }

      document.getElementById('contactError').classList.remove('active');

      try {
        // Update submission
        const detailsResponse = await fetch(`/api/v1/submission/${submissionId}/details`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: phone || null,
            email: email || null,
            address: address || null,
            postcode: postcode || null,
            preferredTimeslot: timeslot || null
          })
        });

        if (!detailsResponse.ok) throw new Error('Details update failed');

        // Submit
        const submitResponse = await fetch(`/api/v1/submission/${submissionId}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });

        const submitData = await submitResponse.json();

        // Show success screen
        document.getElementById('detailsForm').classList.remove('active');
        document.getElementById('successScreen').classList.add('active');
        document.getElementById('successMessage').textContent = submitData.message;

        // Disable inputs
        document.getElementById('textInput').disabled = true;
        document.getElementById('recordBtn').disabled = true;
      } catch (error) {
        console.error('Submission error:', error);
        document.getElementById('contactError').textContent = 'Submission failed. Please try again.';
        document.getElementById('contactError').classList.add('active');
      }
    }

    // Start on focus
    document.getElementById('textInput').addEventListener('focus', () => {
      if (!conversationStarted) {
        startSubmission();
      }
    });
  </script>
</body>
</html>
