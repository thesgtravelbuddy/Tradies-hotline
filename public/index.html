<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a visit</title><link rel="stylesheet" href="/styles.css"></head><body><header><strong id="business-name">Your Trade Business</strong><p>Tell us what’s happening and we’ll get back to you.</p></header><main><section class="card"><div id="form-panel"><h1>Request help</h1><p>Please provide a few details so the right person can contact you.</p><form id="intake-form" novalidate><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required><div id="email-wrap"><label for="email">Email <span id="email-optional">(optional)</span></label><input id="email" name="email" type="email" autocomplete="email"></div><label for="serviceAddress">Service address</label><input id="serviceAddress" name="serviceAddress" autocomplete="street-address" required><label for="preferredContactMethod">Best way to contact you</label><select id="preferredContactMethod" name="preferredContactMethod"><option value="phone">Phone</option><option value="email">Email</option></select><label for="description">What do you need help with?</label><textarea id="description" name="description" placeholder="Describe what you’ve noticed" required></textarea><div id="errors" class="error" role="alert"></div><button>Send request</button></form></div><div id="success" class="success hidden"><h1>Thanks — we’ve received your request.</h1><p>Our team will review the details and contact you using your preferred method.</p></div></section></main><script type="module" src="/customer.js"></script></body></html>
